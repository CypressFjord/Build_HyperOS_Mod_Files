name: 📦 Build_HyperOS_Mod_Files

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'HyperOS的ROM卡刷包链接'
        required: true
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Environment
        run: |
          echo "=== 1. 初始化环境 ==="
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -yqq aria2 p7zip-full tree
          chmod -R +x tools/

      - name: Download ROM with Aria2
        run: |
          echo "📥 下载 ROM 中"
          aria2c -x16 -s16 -j$(nproc) -U "Mozilla/5.0" -d . "${{ github.event.inputs.rom_url }}" -o rom.zip

      - name: Extract Payload (Safe Mode)
        run: |
          echo "📦 提取 Payload"
          7z e rom.zip payload.bin > /dev/null
          rm rom.zip
          
          mkdir -p extracted_images
          echo "🛠️ 独立提取分区镜像"
          ./tools/payload_extract -s -o extracted_images -i payload.bin -X mi_ext -T0 || true
          ./tools/payload_extract -s -o extracted_images -i payload.bin -X product -T0 || true
          ./tools/payload_extract -s -o extracted_images -i payload.bin -X system -T0 || true
          ./tools/payload_extract -s -o extracted_images -i payload.bin -X system_ext -T0 || true
          rm payload.bin
          echo "📊 成功提取到的镜像："
          ls -lh extracted_images/

      - name: Extract EROFS
        run: |
          echo "📂 解包 EROFS 镜像"
          mkdir -p mi_ext product system system_ext        
          if [ -f extracted_images/mi_ext.img ]; then
            cd mi_ext && sudo ../tools/extract.erofs -i ../extracted_images/mi_ext.img -x -s && cd ..
          fi
          if [ -f extracted_images/product.img ]; then
            cd product && sudo ../tools/extract.erofs -i ../extracted_images/product.img -x -s && cd ..
          fi
          if [ -f extracted_images/system.img ]; then
            cd system && sudo ../tools/extract.erofs -i ../extracted_images/system.img -x -s && cd ..
          fi
          if [ -f extracted_images/system_ext.img ]; then
            cd system_ext && sudo ../tools/extract.erofs -i ../extracted_images/system_ext.img -x -s && cd ..
          fi
          sudo rm -rf extracted_images

      - name: Parse Global build.prop
        id: read_props
        run: |
          echo "📖 全局读取 build.prop 信息"
          MOD_DEVICE="未知"
          OS_VER="未知"
          XMS_VER="未知"          
          PROP_FILES=$(sudo find mi_ext product system system_ext -name "build.prop" -type f 2>/dev/null || true)
          for prop in $PROP_FILES; do
            echo "✅ 正在检索: $prop"
            VAL1=$(sudo grep -m 1 "^ro.product.mod_device=" "$prop" | cut -d'=' -f2 | tr -d '\r')
            [ -n "$VAL1" ] && MOD_DEVICE="$VAL1"            
            VAL2=$(sudo grep -m 1 "^ro.mi.os.version.incremental=" "$prop" | cut -d'=' -f2 | tr -d '\r')
            [ -n "$VAL2" ] && OS_VER="$VAL2"           
            VAL3=$(sudo grep -m 1 "^ro.mi.xms.version.incremental=" "$prop" | cut -d'=' -f2 | tr -d '\r')
            [ -n "$VAL3" ] && XMS_VER="$VAL3"
          done          
          echo "mod_device=$MOD_DEVICE" >> $GITHUB_OUTPUT
          echo "os_ver=$OS_VER" >> $GITHUB_OUTPUT
          echo "xms_ver=$XMS_VER" >> $GITHUB_OUTPUT

      - name: Smart Collect Target Files
        run: |
          echo "🔍 智能搜索并重构标准的绝对路径结构"
          mkdir -p extracted_target/product/etc
          mkdir -p extracted_target/product/overlay
          mkdir -p extracted_target/product/pangu/system/app
          mkdir -p extracted_target/system/system/bin
          mkdir -p extracted_target/system_ext/etc/vintf
          echo "▶️ 提取目标文件夹"
          DIR_FEAT=$(sudo find product -type d -name "device_features" 2>/dev/null | head -n 1)
          if [ -n "$DIR_FEAT" ]; then sudo cp -r "$DIR_FEAT" extracted_target/product/etc/; echo "✅ 已抓取: $DIR_FEAT"; else echo "❌ 缺失: device_features"; fi          
          DIR_DISP=$(sudo find product -type d -name "displayconfig" 2>/dev/null | head -n 1)
          if [ -n "$DIR_DISP" ]; then sudo cp -r "$DIR_DISP" extracted_target/product/etc/; echo "✅ 已抓取: $DIR_DISP"; else echo "❌ 缺失: displayconfig"; fi         
          DIR_NFC=$(sudo find product -type d -name "app" 2>/dev/null | head -n 1)
          if [ -n "$DIR_NFC" ]; then sudo cp -r "$DIR_NFC" extracted_target/product/pangu/system/; echo "✅ 已抓取: $DIR_NFC"; else echo "❌ 缺失: app"; fi       
          DIR_APEX=$(sudo find system_ext -type d -name "apex" 2>/dev/null | head -n 1)
          if [ -n "$DIR_APEX" ]; then sudo cp -r "$DIR_APEX" extracted_target/system_ext/; echo "✅ 已抓取: $DIR_APEX"; else echo "❌ 缺失: apex"; fi   
          echo "▶️ 提取 Overlay APK"
          APKS="AospFrameworkResOverlay.apk DevicesAndroidOverlay.apk DevicesOverlay.apk MiuiFrameworkResOverlay.apk MiuiFrameworkTelephonyResOverlay.apk SettingsRroDeviceTypeOverlay.apk"
          for apk in $APKS; do
              APK_PATH=$(sudo find product -type f -name "$apk" 2>/dev/null | head -n 1)
              if [ -n "$APK_PATH" ]; then
                  sudo cp "$APK_PATH" extracted_target/product/overlay/
                  echo "✅ 已抓取: $APK_PATH"
              else
                  echo "❌ 缺失: $apk"
              fi
          done
          echo "▶️ 提取系统文件"
          FILE_CHARGER=$(sudo find system -type f -name "charger" 2>/dev/null | head -n 1)
          if [ -n "$FILE_CHARGER" ]; then sudo cp "$FILE_CHARGER" extracted_target/system/system/bin/; echo "✅ 已抓取: $FILE_CHARGER"; else echo "❌ 缺失: charger"; fi       
          FILE_MANIFEST=$(sudo find system_ext -type f -name "manifest.xml" 2>/dev/null | grep "/vintf/" | head -n 1)
          if [ -n "$FILE_MANIFEST" ]; then sudo cp "$FILE_MANIFEST" extracted_target/system_ext/etc/vintf/; echo "✅ 已抓取: $FILE_MANIFEST"; else echo "❌ 缺失: manifest.xml"; fi          
          echo "📊 重构后的干净目录结构预览："
          tree extracted_target/ || ls -R extracted_target/          
          echo "🗜️ 正在打包提取出的文件"
          cd extracted_target
          sudo chown -R $USER:$USER .
          7z a -tzip ../extracted_custom_files.zip *         
          echo "✅ 提取并打包完成！"

      - name: Generate Release Tag
        id: tag
        run: echo "release_tag=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload Extracted Files to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Specific-Extraction-${{ steps.tag.outputs.release_tag }}
          name: "📦 系统文件提取 - ${{ steps.read_props.outputs.mod_device }} (${{ steps.read_props.outputs.os_ver }})"
          body: |
            提取信息
            - 机型代号: `${{ steps.read_props.outputs.mod_device }}`
            - SOTA 版本: `${{ steps.read_props.outputs.xms_ver }}`
            - 系统版本: `${{ steps.read_props.outputs.os_ver }}`
            - 原ROM: ${{ github.event.inputs.rom_url }}
            
            已成功提取以下内容:
            - 📂 `/product/etc/device_features/`
            - 📂 `/product/etc/displayconfig/`
            - 📄 `/product/overlay/` 
            - 📄 `/system/system/bin/charger` 
            - 📂 `/system_ext/apex/`
            - 📄 `/system_ext/etc/vintf/manifest.xml`
               所有文件均保留了原有的绝对路径结构
          files: extracted_custom_files.zip
          draft: false
          prerelease: false